name: Archive LE DEKLIK V002 images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - name: Transfer existing assets
        working-directory: tools/le-deklik-drive-sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.LE_DEKLIK_DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: 1yHb8ot1JDDJZiSDAnVrvw7JptI2iJJy4
        run: python sync.py
