<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/theme.css"><title>Visite · CRM</title></head><body><main class="shell"><p><a href="/terrain.html">← Aujourd'hui</a></p><div class="card"><span class="badge" id="status">Visite</span><h1>Relevé</h1><p class="muted" id="save">Chargement…</p><div id="questions"></div><hr><h2>Actions</h2><div id="actions"></div><hr><h2>Photos du relevé</h2><div id="photos" style="display:flex;flex-wrap:wrap;gap:10px;padding:8px 0"></div><form id="af"><input id="at" placeholder="Nouvelle action"><button>Ajouter l'action</button></form><hr><div id="result" class="hidden"></div><button id="finish">Terminer la visite</button></div></main><script>
const id=new URLSearchParams(location.search).get('id'),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function A(u,o={}){let r=await fetch(u,{...o,headers:{'content-type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(d.error||r.status),{status:r.status,data:d});return d}
let D;async function load(){try{D=await A('/api/visits/'+id);status.textContent=D.visit.status;const map=Object.fromEntries(D.responses.map(r=>[r.question_id,r.value]));questions.innerHTML=D.questions.map(q=>'<div class="q"><strong>'+E(q.label)+(q.required?' *':'')+'</strong>'+input(q,map[q.id])+'</div>').join('')||'<p class="muted">Aucune question configurée.</p>';actions.innerHTML=D.actions.map(a=>'<div class="row"><span>'+E(a.title)+'</span><span class="badge">'+E(a.status)+'</span></div>').join('');photos.innerHTML=(D.photos||[]).map(p=>'<a target="_blank" rel="noopener noreferrer" href="'+E(p.url)+'"><img alt="Photo de visite" loading="lazy" style="width:120px;height:120px;object-fit:cover;border-radius:12px" src="'+E(p.url)+'"></a>').join('')||'<p class="muted">Aucune photo synchronisée.</p>';if(D.visit.status==='completed'){showResult(D.perfect_store);save.textContent='Visite terminée · historique en lecture seule';document.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);finish.hidden=true;af.hidden=true}else{save.textContent='Sauvegarde progressive active';bind()}}catch(e){questions.innerHTML='<p class="error">'+E(e.message)+'</p>'}}
function showResult(ps){result.classList.remove('hidden');if(!ps||ps.score==null){result.innerHTML='<h2>Perfect Store</h2><p class="muted">Aucun score disponible pour cette visite.</p>';return}const d=Array.isArray(ps.detail)?ps.detail:[];const ok=d.filter(x=>x.status==='compliant').length;const bad=d.filter(x=>x.status==='non_compliant').length;const na=d.filter(x=>x.status==='not_observed').length;result.innerHTML='<h2>Perfect Store</h2><div class="row"><strong>'+E(ps.score)+'/100</strong><span class="badge">'+ok+' conformes · '+bad+' à améliorer'+(na?' · '+na+' non observés':'')+'</span></div>'}
function input(q,v){if(q.type==='yes_no')return '<select data-q="'+q.id+'"><option value="">—</option><option value="true" '+(v===true?'selected':'')+'>Oui</option><option value="false" '+(v===false?'selected':'')+'>Non</option></select>';return '<input data-q="'+q.id+'" value="'+E(v??'')+'">'}
function bind(){document.querySelectorAll('[data-q]').forEach(x=>x.onchange=async()=>{save.textContent='Enregistrement…';let v=x.value;if(v==='true')v=true;if(v==='false')v=false;try{await A('/api/visits/'+id+'/responses',{method:'PUT',body:JSON.stringify({question_id:x.dataset.q,value:v})});save.textContent='✓ Synchronisé'}catch(err){await CRMOffline.enqueue({url:'/api/visits/'+id+'/responses',method:'PUT',body:{question_id:x.dataset.q,value:v}});save.textContent='↑ Enregistré sur cet appareil · à synchroniser'}})}
af.onsubmit=async e=>{e.preventDefault();if(!at.value.trim())return;await A('/api/visits/'+id+'/actions',{method:'POST',body:JSON.stringify({title:at.value})});at.value='';load()};finish.onclick=async()=>{try{const d=await A('/api/visits/'+id+'/complete',{method:'POST',body:'{}'});status.textContent='completed';save.textContent='Visite terminée · historique en lecture seule';showResult(d.perfect_store);document.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);finish.hidden=true;af.hidden=true}catch(e){alert(e.data?.error==='required_answers_missing'?'Des réponses obligatoires manquent.':e.message)}};load();
</script><script src="/offline.js"></script></body></html>
