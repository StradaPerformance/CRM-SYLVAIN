{% extends 'layout.html' %}
{% block content %}

<!-- Barre secondaire -->
<div class="bg-white shadow-sm p-3 mb-4 sticky-top d-flex justify-content-between align-items-center">
    <h5 class="mb-0">🛠️ Affectation Produits ↔ Centrale ({{ centrale.nom }})</h5>
    <a href="{{ url_for('admin_missions') }}" class="btn btn-outline-dark">↩️ Retour missions</a>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3">
        <label class="form-label">Filtrer par mission :</label>
        <select name="mission_id" class="form-select" onchange="location = this.value;">
            <option value="{{ url_for('affecter_produits_centrale', centrale_id=centrale.id) }}">Toutes les missions</option>
            {% for mission in missions %}
            <option value="{{ url_for('affecter_produits_centrale', centrale_id=centrale.id, mission_id=mission.id) }}" {% if mission.id == mission_id %}selected{% endif %}>
                {{ mission.nom }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Produit</th>
                    <th>Strate</th>
                </tr>
            </thead>
            <tbody>
                {% for produit in produits %}
                <tr>
                    <td>
                        <strong>{{ produit.libelle }}</strong><br>
                        <small class="text-muted">EAN: {{ produit.code_ean }}</small>
                    </td>
                    <td>
                        <select name="strate_{{ produit.id }}" class="form-select">
                            <option value="">–</option>
                            {% for strate in strates %}
                            <option value="{{ strate }}" {% if affectation_dict.get(produit.id) == strate %}selected{% endif %}>{{ strate }}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="text-end">
        <button type="submit" class="btn btn-success">💾 Enregistrer les affectations</button>
    </div>
</form>

{% endblock %}
