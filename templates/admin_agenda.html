{% extends "layout.html" %}
{% block content %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />

<div class="container mt-4">
  <h2>📊 Agenda </h2>
  <form method="GET" class="mb-4">
  </form>

  <div id="calendar"></div>
</div>

<!-- Modal d'ajout de visite -->
<div class="modal fade" id="modalVisite" tabindex="-1" aria-labelledby="modalVisiteLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form id="form-visite" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalVisiteLabel">➕ Ajouter une visite</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="user_id" id="form-user-id" value="{{ current_user.id if current_user.is_authenticated else '' }}">
        <input type="hidden" name="magasin_id" id="magasin_id">

        <div class="mb-3">
          <label for="magasin" class="form-label">🛍️ Magasin</label>
          <input type="text" class="form-control" id="magasin" name="magasin" required placeholder="Nom, ville ou enseigne...">
        </div>

        <div class="mb-3">
          <label for="motif" class="form-label">📌 Motif</label>
          <select class="form-select" id="motif" name="statut" required>
            <option value="relevé">Relevé merch</option>
            <option value="rdv">RDV simple</option>
            <option value="visite">Visite terrain</option>
            <option value="réunion">Réunion</option>
            <option value="formation">Formation</option>
            <option value="congé">Congés</option>
          </select>
        </div>

        <div class="row">
          <div class="col-4">
            <label for="date_debut" class="form-label">📅 Date</label>
            <input type="date" class="form-control" id="date_debut" name="date_visite" required>
          </div>
          <div class="col-4">
            <label for="heure_debut" class="form-label">🕓 Heure début</label>
            <input type="time" class="form-control" id="heure_debut" name="heure_debut" required>
          </div>
          <div class="col-4">
            <label for="heure_fin" class="form-label">🕕 Heure fin</label>
            <input type="time" class="form-control" id="heure_fin" name="heure_fin">
          </div>
        </div>

        <div class="mb-3 mt-2">
          <label for="commentaire" class="form-label">📝 Commentaire</label>
          <textarea class="form-control" id="commentaire" name="commentaire" rows="2" placeholder="Notes, infos spécifiques..."></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">💾 Enregistrer</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
      </div>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const userId = '{{ selected_user_id or current_user.id }}';
    const url = userId ? `/api/agenda/${userId}` : '/api/agenda/all';

    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
      initialView: 'timeGridWeek',
      locale: 'fr',
      allDaySlot: false,
      selectable: true,
      slotMinTime: '00:00:00',
      slotMaxTime: '24:00:00',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
      },
      events: url,

      select: function (info) {
        $('#modalVisite').modal('show');

        const start = new Date(info.startStr);
        const end = new Date(info.endStr);

        const dateStr = start.toISOString().split('T')[0];
        const heureDebut = start.toTimeString().substring(0, 5);
        const heureFin = end.toTimeString().substring(0, 5);

        $('#date_debut').val(dateStr);
        $('#heure_debut').val(heureDebut);
        $('#heure_fin').val(heureFin);
      }
    });

    calendar.render();

    $('#form-visite').on('submit', function (e) {
      e.preventDefault();

      const data = {
        user_id: $('#form-user-id').val(),
        magasin_id: $('#magasin_id').val(),
        statut: $('#motif').val(),
        date_visite: $('#date_debut').val(),
        heure_debut: $('#heure_debut').val(),
        heure_fin: $('#heure_fin').val(),
        commentaire: $('#commentaire').val()
      };

      $.post('/api/agenda/create', data)
        .done(function () {
          $('#modalVisite').modal('hide');
          calendar.refetchEvents();
        })
        .fail(function () {
          alert("❌ Erreur lors de la création de la visite.");
        });
    });

    $('#magasin').autocomplete({
      source: function (request, response) {
        const userId = $('#form-user-id').val();
        $.ajax({
          url: '/api/magasins/search',
          data: { q: request.term, user_id: userId },
          success: function (data) {
            response(data.map(m => ({
              label: `${m.nom} (${m.ville || 'N/A'} - ${m.enseigne || '-'})`,
              value: m.nom,
              id: m.id
            })));
          }
        });
      },
      minLength: 3,
      select: function (event, ui) {
        $('#magasin').val(ui.item.label);
        $('#magasin_id').val(ui.item.id);
        return false;
      }
    });
  });
</script>
{% endblock %}
