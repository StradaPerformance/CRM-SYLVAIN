{% extends 'layout.html' %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap');
  body { background-color: #ffffff; font-family: 'Montserrat', sans-serif; color: #333; }
  .tab-bar { display: flex; gap: 2rem; border-bottom: 2px solid #e0e0e0; margin-bottom: 2rem; padding-left: 1rem; background-color: #ffffff; position: sticky; top: 0; z-index: 10; }
  .tab-link { padding: 1rem 0; font-weight: 500; color: #444; position: relative; text-decoration: none; transition: color 0.3s; }
  .tab-link::after { content: ""; position: absolute; height: 2px; width: 0; left: 0; bottom: 0; background-color: #d80c45; transition: width 0.3s ease; }
  .tab-link:hover::after, .tab-link.active::after { width: 100%; }
  .tab-link:hover, .tab-link.active { color: #d80c45; }
</style>

<div class="tab-bar">
  <a href="{{ url_for('admin_magasins', mission_id=mission_id) }}" class="tab-link active">📋 Liste des magasins</a>
  <a href="{{ url_for('import_magasins', mission_id=mission_id) }}" class="tab-link">📥 Import Excel</a>
  <a href="{{ url_for('export_magasins', mission_id=mission_id) }}" class="tab-link">📤 Export Excel</a>
  <a href="{{ url_for('create_magasin', mission_id=mission_id) }}" class="tab-link">➕ Ajouter un magasin</a>
</div>

<div class="container mt-4">
  <h2 class="mb-4">🗂️ Magasins - Vue par mission</h2>

  <form method="GET" class="mb-3 d-flex align-items-center gap-2">
    <label class="fw-bold mb-0" for="missionFilter">🎯 Mission :</label>
    <select name="mission_id" id="missionFilter" class="form-select">
      <option value="">-- Toutes les missions --</option>
      {% for mission in missions %}
        <option value="{{ mission.id }}" {% if mission.id|string == mission_id|string %}selected{% endif %}>{{ mission.nom }}</option>
      {% endfor %}
    </select>
  </form>

  <div class="table-responsive">
    <table id="table-magasins" class="table table-striped table-hover w-100">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Enseigne</th>
          <th>Ville</th>
          <th>Secteur</th>
          <th>Chef de secteur</th>
          <th>Questionnaire</th>
          <th>Actif</th>
          <th>Action</th>
        </tr>
      </thead>
    </table>
  </div>
</div>

<!-- ✅ jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- ✅ DataTables -->
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">

<script>
$(document).ready(function () {
  const missionIdInitial = "{{ mission_id or '' }}";

  const table = $('#table-magasins').DataTable({
    processing: true,
    serverSide: true,
    ajax: {
      url: "{{ url_for('api_magasins') }}",
      data: function (d) {
        const val = $('#missionFilter').val() || missionIdInitial;
        d.mission_id = val;
      }
    },
    columns: [
      {
        data: 'nom',
        render: function(data, type, row) {
          return `<a href="/fiche_magasin/${row.id}" target="_blank">${data}</a>`;
        }
      },
      { data: 'enseigne' },
      { data: 'ville' },
      { data: 'secteur' },
      { data: 'chef_secteur' },
      { data: 'questionnaire_id', orderable: false, searchable: false },
      {
        data: 'actif',
        render: function(data, type, row) {
          return data ? '✅' : '❌';
        },
        orderable: false,
        searchable: false
      },
      { data: 'action', orderable: false, searchable: false }
    ],
    pageLength: 25,
    lengthMenu: [10, 25, 50, 100],
    order: [[0, 'asc']],
    language: {
      url: '//cdn.datatables.net/plug-ins/1.13.4/i18n/fr-FR.json'
    }
  });

  $('#missionFilter').on('change', function () {
    table.ajax.reload();
  });
});
</script>

{% endblock %}
