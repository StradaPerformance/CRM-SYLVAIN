{% extends "layout.html" %}
{% block content %}

<div class="container mt-4">
    <h4>➕ Ajouter une centrale pour {{ enseigne.nom }}</h4>

    <!-- ✅ Bloc d'affichage des messages flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="mb-3">
            <label for="nom" class="form-label">Nom de la centrale</label>
            <input type="text" class="form-control" id="nom" name="nom" required>
        </div>
        <div class="mb-3">
            <label for="type_centrale" class="form-label">Type</label>
            <select class="form-select" name="type_centrale" required>
                <option value="Nationale">Nationale</option>
                <option value="Régionale">Régionale</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">💾 Ajouter</button>
        <a href="{{ url_for('mission_enseigne_centrales', mission_id=mission.id, enseigne_id=enseigne.id) }}" class="btn btn-secondary">Retour</a>
    </form>
    

{% endblock %}
