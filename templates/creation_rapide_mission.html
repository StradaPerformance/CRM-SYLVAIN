{% extends 'layout.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Étape 1/5 : Création de la mission</h2>

    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
            <label for="nom" class="form-label">Nom de la mission *</label>
            <input type="text" class="form-control" id="nom" name="nom" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="date_debut" class="form-label">Date de début</label>
                <input type="date" class="form-control" id="date_debut" name="date_debut">
            </div>
            <div class="col-md-6 mb-3">
                <label for="date_fin" class="form-label">Date de fin</label>
                <input type="date" class="form-control" id="date_fin" name="date_fin">
            </div>
        </div>

        <div class="mb-3">
            <label for="statut" class="form-label">Statut</label>
            <select class="form-select" id="statut" name="statut">
                <option value="Préparation" selected>Préparation</option>
                <option value="En cours">En cours</option>
                <option value="Clôturée">Clôturée</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="type" class="form-label">Type de mission</label>
            <input type="text" class="form-control" id="type" name="type">
        </div>

        <div class="mb-3">
            <label for="objectif" class="form-label">Objectif</label>
            <textarea class="form-control" id="objectif" name="objectif" rows="3"></textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a href="/admin/missions" class="btn btn-secondary">⬅️ Retour</a>
            <button type="submit" class="btn btn-success">➡️ Suivant</button>
        </div>
    </form>
</div>
{% endblock %}
