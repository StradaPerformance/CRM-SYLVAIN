{% extends 'layout.html' %}

{% block content %}
<div class="container mt-4">
    <h2>➕ Créer un nouveau produit</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="mb-3">
            <label for="libelle" class="form-label">Libellé</label>
            <input type="text" class="form-control" id="libelle" name="libelle" required>
        </div>

        <div class="mb-3">
            <label for="code_ean" class="form-label">Code EAN</label>
            <input type="text" class="form-control" id="code_ean" name="code_ean">
        </div>

        <div class="mb-3">
            <label for="code_interne" class="form-label">Code Interne</label>
            <input type="text" class="form-control" id="code_interne" name="code_interne">
        </div>

        <div class="mb-3">
            <label for="marque" class="form-label">Marque</label>
            <input type="text" class="form-control" id="marque" name="marque">
        </div>

        <div class="mb-3">
            <label for="famille" class="form-label">Famille</label>
            <input type="text" class="form-control" id="famille" name="famille">
        </div>

        <div class="mb-3">
            <label for="gamme" class="form-label">Gamme</label>
            <input type="text" class="form-control" id="gamme" name="gamme">
        </div>

        <div class="mb-3">
            <label for="typologie" class="form-label">Typologie</label>
            <input type="text" class="form-control" id="typologie" name="typologie">
        </div>

        <div class="mb-3">
            <label for="photo" class="form-label">Photo (optionnelle)</label>
            <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
        </div>

        <div class="mb-3">
            <label class="form-label">Associer à des missions</label>
            {% for mission in missions %}
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="missions" value="{{ mission.id }}" id="mission_{{ mission.id }}">
                    <label class="form-check-label" for="mission_{{ mission.id }}">
                        {{ mission.nom }}
                    </label>
                </div>
            {% endfor %}
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">✅ Enregistrer le produit</button>
            <a href="{{ url_for('admin_produits') }}" class="btn btn-secondary">↩️ Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
