{% extends 'layout.html' %}
{% block content %}
<div class="container mt-4">
    <h2>✏️ Modifier une enseigne</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <!-- Nom -->
        <div class="mb-3">
            <label for="nom" class="form-label">Nom de l'enseigne</label>
            <input type="text" class="form-control" id="nom" name="nom" value="{{ enseigne.nom }}" required>
        </div>

        <!-- Catégorie -->
        <div class="mb-3">
            <label for="categorie" class="form-label">Catégorie</label>
            <input type="text" class="form-control" id="categorie" name="categorie" value="{{ enseigne.categorie or '' }}">
        </div>

        <!-- Centrale principale -->
        <div class="mb-3">
            <label for="centrale" class="form-label">Centrale principale</label>
            <input type="text" class="form-control" id="centrale" name="centrale" value="{{ enseigne.centrale_principale or '' }}">
        </div>

        <!-- Logo actuel -->
        {% if enseigne.logo %}
        <div class="mb-3">
            <label class="form-label">Logo actuel :</label><br>
            <img src="{{ url_for('static', filename='uploads/' ~ enseigne.logo) }}" alt="Logo actuel" style="max-height: 100px;">
        </div>
        {% endif %}

        <!-- Logo local -->
        <div class="mb-3">
            <label for="logo" class="form-label">Changer le logo (fichier local)</label>
            <input type="file" class="form-control" id="logo" name="logo" accept=".png,.jpg,.jpeg">
        </div>

        <!-- Logo distant -->
        <div class="mb-3">
            <label for="logo_url" class="form-label">Ou coller une URL d'image distante</label>
            <input type="url" class="form-control" id="logo_url" name="logo_url" placeholder="https://example.com/logo.png">
        </div>

        <!-- Aperçu dynamique -->
        <div id="preview" class="mb-3" style="display:none;">
            <label class="form-label">Aperçu du nouveau logo :</label><br>
            <img id="logo_preview" src="" style="max-height: 100px;">
        </div>

        <!-- Bouton -->
        <button type="submit" class="btn btn-primary">💾 Enregistrer les modifications</button>
        <a href="{{ url_for('admin_assortiments_unifie') }}" class="btn btn-secondary">Retour</a>

    </form>
</div>

<script>
    document.getElementById('logo_url').addEventListener('input', function () {
        const url = this.value;
        const preview = document.getElementById('preview');
        const img = document.getElementById('logo_preview');
        if (url && (url.endsWith('.png') || url.endsWith('.jpg') || url.endsWith('.jpeg'))) {
            img.src = url;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
    });
</script>
{% endblock %}
