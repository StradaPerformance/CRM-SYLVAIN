
{% extends 'layout.html' %}
{% block content %}

<div class="container mt-5">
    <div class="alert alert-danger text-center p-4 border">
        <h3>🗑️ Supprimer l'enseigne</h3>
        <p class="lead">Souhaites-tu vraiment supprimer <strong>{{ enseigne.nom }}</strong> de la base ?</p>
        <form method="POST" action="{{ url_for('supprimer_enseigne_definitive', enseigne_id=enseigne.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="{{ url_for('admin_assortiments_super_admin') }}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-danger">🧨 Supprimer définitivement</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
